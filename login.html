<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="SMMAI — Log in to access the dashboard">
    <title>S M M A I — Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ─── Design direction: DESIGN.md + Zyno ─────────
           Brand:      S M M A I — spaced-letter wordmark, AI-powered SMM platform
           Dials:      ENERGY 3 / RHYTHM 1 / MOTION 1 (calm on login)
           Palette:    Emerald #059669 on deep green-cast #070c09
           Font:       Plus Jakarta Sans — warm geometric, 400/500/600/700/800
           Wordmark:   "S M M AI" — wide tracked caps, 800wt, AI in primary emerald
           ──────────────────────────────────────────────────────────────────────────── */
        :root {
            --bg:            #070c09;
            --panel:         #0e1812;
            --surface:       #0b1310;
            --text:          #f2f6f3;
            --muted:         #718579; /* 5.01:1 on #070c09, WCAG AA */
            --line:          #162618;
            --primary:       #059669;
            --primary-hover: #047857;
            --primary-light: rgba(5,150,105,0.12);
            --secondary:     #2563eb;
            --accent:        #f59e0b;

            --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;

            --radius-small:  4px;
            --radius-medium: 8px;
            --radius-large:  16px;

            --text-xs:   0.75rem;
            --text-sm:   0.875rem;
            --text-base: 1rem;
            --text-md:   1.125rem;
            --text-lg:   1.25rem;
            --text-xl:   1.5rem;
            --text-2xl:  2rem;
            --text-3xl:  2.75rem;

            --weight-normal:   400;
            --weight-medium:   500;
            --weight-semibold: 600;
            --weight-bold:     700;
            --weight-black:    800;

            --lh-tight:   1.2;
            --lh-snug:    1.35;
            --lh-normal:  1.55;
            --lh-relaxed: 1.65;
            --lh-loose:   1.75;

            --ls-wordmark: 0.38em;
            --ls-label:    0.1em;
            --ls-tight:   -0.03em;
            --ls-snug:    -0.02em;
            --ls-normal:   0;
        }

        html.light {
            --bg:            #f8faf9;
            --panel:         #ffffff;
            --surface:       #f0f4f2;
            --text:          #0d1a14;
            --muted:         #4a5e52;
            --line:          #d1e0d6;
            --primary:       #047857;
            --primary-hover: #065f46;
            --primary-light: rgba(4,120,87,0.10);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: var(--text-base);
            line-height: var(--lh-relaxed);
            font-weight: var(--weight-normal);
        }
        a { color: inherit; text-decoration: none }
        a:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px }
        img { max-width: 100%; height: auto }
        strong, b { font-weight: var(--weight-semibold) }
        ::selection { background: var(--primary); color: var(--bg) }

        /* ─── Layout ─────────────────────────────────────────────────────────────── */
        .wrap { max-width: 420px; margin: 3rem auto; padding: 0 2rem }

        /* ─── Skip link ─────────────────────────────────────────────────────────────── */
.skip-link {
  position: absolute;
  top: -999px;
  left: -999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
.skip-link:focus {
  top: .75rem;
  left: .75rem;
  width: auto;
  height: auto;
  overflow: visible;
}

/* ─── Form styles ───────────────────────────────────────────────────────── */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-medium);
            padding: 2rem;
        }

        .form-group { margin-bottom: 1.5rem }

        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--muted); font-size: var(--text-sm) }

.form-group input {
  width: 100%; padding: 0.75rem; background: var(--surface);
  border: 1px solid var(--muted); border-radius: var(--radius-medium);
  color: var(--text); font-size: var(--text-base); font-family: var(--font)
}
.form-group input:focus { outline: 2px solid var(--primary); outline-offset: 4px }

        .btn {
            width: 100%; padding: 0.75rem; background: var(--primary);
            color: var(--bg); border: none; border-radius: var(--radius-medium);
            font-size: var(--text-md); font-weight: var(--weight-bold); cursor: pointer;
            margin-top: 0.5rem; transition: background .2s ease
        }

        .btn:hover { background: var(--primary-hover) }

        .btn-secondary {
            width: 100%; padding: 0.75rem; background: transparent;
            color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius-medium);
            font-size: var(--text-md); font-weight: var(--weight-semibold); cursor: pointer;
            margin-top: 0.5rem; transition: border-color .2s, color .2s
        }

        .btn-secondary:hover { border-color: var(--primary); color: var(--primary) }

        .links { margin-top: 2rem; font-size: var(--text-sm); color: var(--muted) }
        .links a { color: var(--primary); text-decoration: underline }

        /* ─── Focus visible ────────────────────────────────────────────────────── */
        *:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px }

        /* ─── Reduced motion ───────────────────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important }
        }
    </style>
</head>
<body>

<!-- ─── Skip link ─────────────────────────────────────────────────────────────── -->
<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="login-header" aria-label="Login page header">
    <div class="wrap">
        <a class="logo" href="index.html" aria-label="SMMAI home">S M M <span class="ai">AI</span></a>
    </div>
</header>

<main id="main-content">
    <div class="wrap">
        <div class="card">
        <h1 style="margin-top: 0; margin-bottom: 1.5rem">Sign in to SMMAI</h1>

<div style="display:flex;justify-content:flex-end;margin-bottom:1.5rem">
    <button class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true">☾</span>
    </button>
</div>

        <form id="loginForm" novalidate onsubmit="event.preventDefault(); alert('Form submitted');">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" required placeholder="you@company.com">
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" required placeholder="••••••••">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem">
                <button type="submit" class="btn">Sign in</button>
                <div style="display: inline-flex; gap: 0.5rem">
                    <a style="color: var(--muted); text-decoration: none;" href="#">Forgot password?</a>
                    <a style="color: var(--muted); text-decoration: none;" href="#">Create free account</a>
                </div>
            </div>
        </form>
    </div>
</main>

<script>
    // ─── Theme toggle — localStorage persistence (DESIGN.md R-21, antislop R-34) ────────────────────
    (function() {
      var btn = document.querySelector('.theme-toggle');
      var icon = btn.querySelector('.theme-icon');
      var saved = localStorage.getItem('smma-theme');
      if (saved === 'light') {
        document.documentElement.classList.add('light');
        icon.textContent = '☀';
      }
      btn.addEventListener('click', function() {
        var isLight = document.documentElement.classList.toggle('light');
        icon.textContent = isLight ? '☀' : '☾';
        localStorage.setItem('smma-theme', isLight ? 'light' : 'dark');
      });
    })();
</script>

</body>
</html>
