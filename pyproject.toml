[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-smm-automation"
version = "0.1.0"
description = "AI-assisted social media management automation with human approval gates."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "smm.main:app"
[project.scripts]
smm = "smm.cli:main"
