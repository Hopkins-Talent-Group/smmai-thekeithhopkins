name: Regenerate pnpm lockfile (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr1-durable-publish-retries-v2
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile without scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Prove frozen install succeeds
        run: pnpm install --frozen-lockfile
      - name: Verify expected manifest resolutions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          if (!/^      next:\n        specifier: 16\.4\.3\n        version: 16\.4\.3/m.test(lock)) {
            console.error('Expected dashboard next importer to resolve to 16.4.3');
            process.exit(1);
          }
          if (!/^  sharp@0\.35\.5:/m.test(lock) && !/^  sharp@0\.35\.[6-9]:/m.test(lock)) {
            console.error('Expected sharp 0.35.5+ package resolution; inspect generated lockfile.');
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-regenerated
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2
