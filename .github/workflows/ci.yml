name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dashboard dependencies
        working-directory: nextjs-setup/nextjs-dashboard
        run: npm install --no-package-lock
      - name: Build dashboard
        working-directory: nextjs-setup/nextjs-dashboard
        env:
          # Build-time-only placeholder; never used to connect to a database.
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test?sslmode=disable
        run: npm run build
      - name: Lint dashboard
        working-directory: nextjs-setup/nextjs-dashboard
        run: npm run lint

  ruff-advisory:
    name: Ruff (advisory; existing baseline debt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Report repository-wide Ruff findings (non-blocking)
        id: ruff
        continue-on-error: true
        run: ruff check .
