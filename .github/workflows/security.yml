name: Security

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the upstream CLI directly: the GitHub Action requires a paid
      # GITLEAKS_LICENSE for organization repositories.
      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          version="8.24.3"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan repository history for secrets
        run: gitleaks git . --redact --verbose --exit-code 1

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade audit tooling
        run: python -m pip install --upgrade "setuptools>=84.1.0" "pip" "pip-audit"
      - run: pip-audit
      # Use the repository root packageManager pin (pnpm@9.15.0) as the
      # single source of truth; an explicit action version conflicts with it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Resolve the patched graph first; the lockfile must be regenerated and committed
      # with these manifest updates before restoring frozen-lockfile enforcement.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm audit --prod --audit-level high
